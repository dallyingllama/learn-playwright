name: Playwright Test Runner & Reporter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REPORT_RETENTION_DAYS: 2
  DOCS_PIPELINE: antora

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.9.0 --activate
          pnpm install

      - name: Install Asciidoctor CLI (fallback)
        if: env.DOCS_PIPELINE == 'asciidoctor'
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Run unit tests (gate)
        run: |
          pnpm exec cross-env TEST_ENV=e2e playwright test tests/unit --reporter=line

      - name: Run sanity tests
        id: sanityrun
        continue-on-error: true
        run: |
          export TEST_ENV=e2e
          pnpm playwright install --with-deps
          pnpm exec cross-env TEST_ENV=e2e playwright test --grep=@sanity

      - name: Run full Playwright suite
        id: fullrun
        if: steps.sanityrun.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm exec cross-env TEST_ENV=e2e playwright test

      - name: Record test result status
        run: |
          mkdir -p playwright-report
          if [ "${{ steps.sanityrun.outcome }}" != "success" ]; then
            echo "FAIL" > playwright-report/status.txt
          elif [ "${{ steps.fullrun.outcome }}" = "success" ]; then
            echo "PASS" > playwright-report/status.txt
          else
            echo "FAIL" > playwright-report/status.txt
          fi

      - name: Set timestamp including converting to timezone
        run: |
          export TZ="Europe/Berlin"
          export REPORT_DIR=$(date +'%Y-%m-%d_%H:%M:%S')
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV

      - name: Download existing GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: history

      - name: Delete old reports
        run: |
          find history -maxdepth 1 -type d -name "20*" -mtime +${{ env.REPORT_RETENTION_DAYS }} -exec rm -rf {} \;

      - name: Create folder-safe timestamp
        run: |
          SAFE_DIR_NAME=$(echo "$REPORT_DIR" | tr ':' '-')
          echo "SAFE_DIR_NAME=$SAFE_DIR_NAME" >> $GITHUB_ENV
          mkdir -p history/$SAFE_DIR_NAME
          cp -r playwright-report/* history/$SAFE_DIR_NAME

      - name: Build documentation with Antora
        if: env.DOCS_PIPELINE == 'antora'
        run: |
          corepack pnpm run docs:build:antora
          corepack pnpm run docs:verify:antora
          mkdir -p history/docs
          cp -r spikes/antora-pilot/build/site/* history/docs/
          cat > history/docs/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./demoqa-docs/current/index.html">
            <title>Redirecting...</title>
            <link rel="canonical" href="./demoqa-docs/current/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="./demoqa-docs/current/index.html">documentation</a>.</p>
          </body>
          </html>
          EOF

      - name: Build documentation with Asciidoctor (fallback)
        if: env.DOCS_PIPELINE == 'asciidoctor'
        run: |
          mkdir -p history/docs
          find docs -type f -name "*.adoc" | while read -r file; do
            rel_path="${file#docs/}"
            out_path="history/docs/${rel_path%.adoc}.html"
            rel_dir="$(dirname "$rel_path")"
            style_dir="_theme"
            if [ "$rel_dir" != "." ]; then
              depth=$(awk -F/ '{print NF}' <<< "$rel_dir")
              prefix=""
              for _ in $(seq 1 "$depth"); do
                prefix="../${prefix}"
              done
              style_dir="${prefix}_theme"
            fi
            mkdir -p "$(dirname "$out_path")"
            asciidoctor \
              -a stylesdir="$style_dir" \
              -a stylesheet=playwright.css \
              -a linkcss \
              -a docinfo=shared \
              -o "$out_path" \
              "$file"
          done

      - name: Generate styled index with EJS
        run: node .github/scripts/render-index.js

      - name: Zip report and upload as artifact
        run: |
          mkdir -p artifacts
          zip -r artifacts/playwright-report.zip playwright-report

      - name: Upload zipped report artifact
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/playwright-report.zip

      - name: Add direct link to report in summary
        run: |
          if [ "${{ steps.sanityrun.outcome }}" != "success" ]; then
            echo "### ❌ [View Playwright report](https://dallyingllama.github.io/learn-playwright/$SAFE_DIR_NAME/)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Sanity test stage failed. Full suite was skipped." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.fullrun.outcome }}" == "success" ]; then
            echo "### ✅ [View Playwright report](https://dallyingllama.github.io/learn-playwright/$SAFE_DIR_NAME/)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ [View Playwright report](https://dallyingllama.github.io/learn-playwright/$SAFE_DIR_NAME/)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish Playwright Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./history
          publish_branch: gh-pages

      - name: Fail job if any tests fail
        if: steps.sanityrun.outcome != 'success' || steps.fullrun.outcome == 'failure'
        run: exit 1
